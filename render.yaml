services:
  - type: web
    name: cloud-alert-hub
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: Jwt__Secret
        generateValue: true
      - key: ConnectionStrings__DefaultConnection
        value: Data Source=/app/data/monitoringplatform.db
    disk:
      name: sqlite-data
      mountPath: /app/data
      sizeGB: 1
    healthCheckPath: /api/cloud-status/overview
