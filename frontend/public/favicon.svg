<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title>Cloud Alert Hub</title>
  <desc>Logo oficial de Cloud Alert Hub - Observabilidad cloud</desc>
  <defs>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0f172a"/>
  <circle cx="32" cy="32" r="26" stroke="url(#ring-grad)" stroke-width="1.5" fill="none" opacity="0.4" stroke-dasharray="6 4"/>
  <path d="M44 38c0 5-6 10-13 10s-16-5-16-10c0-3 2-6 6-7-.5-1.5-.5-3 0-5 2-4.5 7.5-6 12-3 .5-3 4-5.5 8.5-4.5 4.5 1 6.5 5.5 5.5 9 2.5 1.5 4 4.5 4 8z" fill="url(#logo-grad)" filter="url(#glow)" opacity="0.95"/>
  <circle cx="48" cy="18" r="4.5" fill="#f59e0b" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4.5;5;4.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
