version: "3.8"

services:
  cloudalerthub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudalerthub
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # Override JWT secret for production (use a strong random value)
      - Jwt__Secret=${JWT_SECRET:-change-this-to-a-32-char-random-string!!!}
      # Connection string: SQLite by default (file persisted in volume)
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/monitoringplatform.db
    volumes:
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/cloud-status/overview"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  sqlite_data:
